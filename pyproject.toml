[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprogen"
# app_version.json の 1.1-beta.4 に対応する PEP 440 表記。
# 実行時に画面へ表示するバージョンは引き続き app_version.json を正とする。
version = "1.1.0b4"
description = "A desktop application for automated grading of programming assignments."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PyQt5~=5.15.11",
    "openpyxl~=3.1.5",
    "psutil>=7.2.2,<8",
    "python-dateutil~=2.9.0.post0",
]

[project.scripts]
autoprogen = "autoprogen.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["autoprogen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = '-ra -v -m "not gui_visible"'
markers = [
    "gui_visible: 可視GUIとデスクトップ環境を必要とするテスト",
]
